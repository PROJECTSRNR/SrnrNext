<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c2c"><title>SRNR NEXT · กรุณาเชื่อมต่ออินเทอร์เน็ต</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#101c2c;color:#eaf2ff;font:16px/1.8 system-ui,sans-serif}main{width:min(420px,calc(100% - 64px));padding:32px 0;text-align:center}img{width:88px;height:88px}h1{font-size:26px;margin:16px 0}p{color:#a8bdd8;margin:0 0 24px}button{display:inline-block;padding:12px 24px;background:#90baff;color:#102139;border-radius:12px;font-weight:700;text-decoration:none;min-height:44px;border:0;font:inherit;font-weight:700;cursor:pointer}small{display:block;color:#a8bdd8;margin-top:24px}button:focus-visible{outline:3px solid #f4c64e;outline-offset:5px}</style></head><body><main><img src="app-icon-192.png" alt="ตราวิทยาลัยเทคนิคสุรนารี" width="88" height="88"><h1>SRNR NEXT</h1><p>ยังเชื่อมต่อระบบไม่ได้<br>เปิด Wi-Fi หรืออินเทอร์เน็ตมือถือ แล้วลองอีกครั้ง เพื่อโหลดโปรแกรมและใช้งานข้อมูลล่าสุด</p><button type="button" id="retryConnection">ลองเปิดระบบอีกครั้ง</button><small>by งานศูนย์ดิจิทัลและสื่อสารองค์กร</small></main><script>document.getElementById("retryConnection").addEventListener("click",function(){location.reload();});</script></body></html>
